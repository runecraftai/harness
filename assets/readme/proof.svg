<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="proof-title proof-desc">
  <title id="proof-title">Runecraft Harness — evidence</title>
  <desc id="proof-desc">Four evidence cards: 1193 deterministic tests with zero tokens, 11 golden assets pinned byte-for-byte, 71 E2E offline tests that are environment-gated, and a 23.4 second versioned hello-world SDLC run.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141824" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10131a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="170" rx="20" fill="#0c0e13"/>
  <rect x="1" y="1" width="1198" height="168" rx="19" fill="none" stroke="#232838"/>

  <g id="card-1" transform="translate(56 30)">
    <rect x="0" y="0" width="258" height="110" rx="14" fill="url(#card-bg)" stroke="#232838"/>
    <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="700" fill="#e3b341">1193</text>
    <text x="18" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">deterministic tests</text>
    <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">offline · zero-token</text>
  </g>

  <g id="card-2" transform="translate(332 30)">
    <rect x="0" y="0" width="258" height="110" rx="14" fill="url(#card-bg)" stroke="#232838"/>
    <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="700" fill="#62c7e8">11</text>
    <text x="18" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">golden assets</text>
    <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">pinned byte-for-byte</text>
  </g>

  <g id="card-3" transform="translate(608 30)">
    <rect x="0" y="0" width="258" height="110" rx="14" fill="url(#card-bg)" stroke="#232838"/>
    <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="700" fill="#62c7e8">71</text>
    <text x="18" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">E2E offline tests</text>
    <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">env-gated · fail-closed</text>
  </g>

  <g id="card-4" transform="translate(884 30)">
    <rect x="0" y="0" width="258" height="110" rx="14" fill="url(#card-bg)" stroke="#232838"/>
    <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="700" fill="#e3b341">23.4s</text>
    <text x="18" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">hello-world SDLC</text>
    <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b93a5">versioned real run</text>
  </g>
</svg>
